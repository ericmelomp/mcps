[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-ops-mcp"
version = "0.3.0"
description = "Compact AWS diagnostics and EKS investigations through configured SSM bastions"
requires-python = ">=3.11"
dependencies = ["boto3>=1.40,<2", "mcp>=1.28,<2", "pydantic>=2.11,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
aws-ops-mcp = "aws_ops_mcp.server:main"
aws-ops-import-credentials = "aws_ops_mcp.import_credentials:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
